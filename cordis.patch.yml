# ============================================================================
# dsh-zh-think —— DSH bundle patch
# ============================================================================
# 本文件是插件的“挂载声明”。它使用 `insert:`（**追加**一行），
# 而不是 id 覆盖（那会整块替换既有的 system-prompt 配置）。
#
# 因此本插件不会修改系统提示词行、不会改变它的配置、也不会与
# GUI 设置面板重写 cordis.patch.yml 的行为冲突。
#
# 中文要求由插件运行时通过 ctx.systemPrompt.section() 注册，
# 而不是由这里的配置文本给出。
# ============================================================================

- insert:
    - id: dsh-zh-think
      name: dsh-zh-think
